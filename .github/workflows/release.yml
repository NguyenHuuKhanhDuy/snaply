name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  # Velopack installs to LOCALAPPDATA/<pack id>. Snaply keeps screenshots and its database in LOCALAPPDATA/Snaply,
  # so the pack id must differ or an uninstall/update could delete user data.
  APP_ID: SnaplyApp
  APP_TITLE: Snaply
  APP_EXE: Snaply.exe
  PROJECT: src/Snaply.App/Snaply.App.csproj
  ICON: src/Snaply.App/Assets/snaply.ico
  REPO_URL: https://github.com/${{ github.repository }}
  # Must equal the Velopack package version in Directory.Packages.props; a mismatch breaks updates.
  VELOPACK_VERSION: 1.2.0

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # A manual workflow_dispatch run has no tag: it builds/packs a throwaway version and skips publishing.
      - name: Determine version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.1-ci.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check Velopack versions match
        shell: bash
        run: |
          pkg=$(grep -oP '<PackageVersion Include="Velopack" Version="\K[^"]+' Directory.Packages.props)
          if [[ "$pkg" != "$VELOPACK_VERSION" ]]; then
            echo "::error::Directory.Packages.props pins Velopack $pkg but the workflow uses vpk $VELOPACK_VERSION. Keep them identical."
            exit 1
          fi

      # Never ship a build that does not pass the tests. The screenshot-rendering suite (every page, both themes, three sizes) takes
      # several minutes and only produces review images, so it is left out here; run it locally with --filter "Category=Screenshots".
      - name: Build
        run: dotnet build Snaply.sln -c Release --nologo -v q

      - name: Test
        run: dotnet test Snaply.sln -c Release --no-build --nologo --filter "Category!=Screenshots"

      - name: Publish
        run: >
          dotnet publish ${{ env.PROJECT }} -c Release -r win-x64 --self-contained true
          -p:Version=${{ env.VERSION }} -o publish

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version ${{ env.VELOPACK_VERSION }}

      # Previous release's package, so vpk can build a delta update. Fails on the very first release.
      # The token avoids GitHub's anonymous API rate limit (403) on shared runner IPs.
      - name: Download previous release
        run: vpk download github --repoUrl "${{ env.REPO_URL }}" --token ${{ secrets.GITHUB_TOKEN }} -o Releases
        continue-on-error: true

      - name: Pack
        run: >
          vpk pack -u ${{ env.APP_ID }} -v ${{ env.VERSION }} -p publish
          -e ${{ env.APP_EXE }} --packTitle ${{ env.APP_TITLE }} -i ${{ env.ICON }} -o Releases

      - name: Upload to GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        run: >
          vpk upload github --repoUrl "${{ env.REPO_URL }}" --token ${{ secrets.GITHUB_TOKEN }}
          -o Releases --publish true --releaseName "${{ env.APP_TITLE }} v${{ env.VERSION }}" --tag ${{ github.ref_name }}

      # The in-app updater reads this feed anonymously, exactly like this step. Retry briefly: GitHub's CDN can lag a few seconds.
      - name: Verify release is visible to the updater
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          url="$REPO_URL/releases/latest/download/releases.win.json"
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sL -o feed.json -w "%{http_code}" "$url" || true)
            if [[ "$code" == "200" ]] && grep -qF "\"Version\":\"$VERSION\"" feed.json; then
              echo "Feed lists $VERSION (attempt $attempt)"
              exit 0
            fi
            echo "Attempt $attempt: HTTP $code, feed does not list $VERSION yet"
            sleep 10
          done
          if [[ "$code" == "404" ]]; then
            echo "::error::$url returned 404 for an anonymous request. If the repository is private, installed apps cannot read releases either: make the repository public or publish releases to a public repository."
          else
            echo "::error::$url (HTTP $code) does not list $VERSION, so installed apps will not detect this update."
          fi
          exit 1
