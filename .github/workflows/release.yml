name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  # Velopack installs to LOCALAPPDATA/<pack id>. Snaply keeps screenshots and its database in LOCALAPPDATA/Snaply,
  # so the pack id must differ or an uninstall/update could delete user data.
  APP_ID: SnaplyApp
  APP_TITLE: Snaply
  APP_EXE: Snaply.exe
  PROJECT: src/Snaply.App/Snaply.App.csproj
  ICON: src/Snaply.App/Assets/snaply.ico
  REPO_URL: https://github.com/${{ github.repository }}
  # Must equal the Velopack package version in Directory.Packages.props; a mismatch breaks updates.
  VELOPACK_VERSION: 1.2.0

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # A manual workflow_dispatch run has no tag: it builds/packs a throwaway version and skips publishing.
      - name: Determine version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.1-ci.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check Velopack versions match
        shell: bash
        run: |
          pkg=$(grep -oP '<PackageVersion Include="Velopack" Version="\K[^"]+' Directory.Packages.props)
          if [[ "$pkg" != "$VELOPACK_VERSION" ]]; then
            echo "::error::Directory.Packages.props pins Velopack $pkg but the workflow uses vpk $VELOPACK_VERSION. Keep them identical."
            exit 1
          fi

      # Never ship a build that does not pass the tests. The screenshot-rendering suite (every page, both themes, three sizes) takes
      # several minutes and only produces review images, so it is left out here; run it locally with --filter "Category=Screenshots".
      - name: Build
        run: dotnet build Snaply.sln -c Release --nologo -v q

      # TEMPORARILY DISABLED to check that packaging works end to end. Turn it back on before relying on a release.
      # - name: Test
      #   run: dotnet test Snaply.sln -c Release --no-build --nologo --filter "Category!=Screenshots"

      - name: Publish
        run: >
          dotnet publish ${{ env.PROJECT }} -c Release -r win-x64 --self-contained true
          -p:Version=${{ env.VERSION }} -o publish

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version ${{ env.VELOPACK_VERSION }}

      # Previous release's package, so vpk can build a delta update. Fails on the very first release.
      # The token avoids GitHub's anonymous API rate limit (403) on shared runner IPs.
      - name: Download previous release
        run: vpk download github --repoUrl "${{ env.REPO_URL }}" --token ${{ secrets.GITHUB_TOKEN }} -o Releases
        continue-on-error: true

      - name: Pack
        run: >
          vpk pack -u ${{ env.APP_ID }} -v ${{ env.VERSION }} -p publish
          -e ${{ env.APP_EXE }} --packTitle ${{ env.APP_TITLE }} -i ${{ env.ICON }} -o Releases

      - name: Upload to GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        run: >
          vpk upload github --repoUrl "${{ env.REPO_URL }}" --token ${{ secrets.GITHUB_TOKEN }}
          -o Releases --publish true --releaseName "${{ env.APP_TITLE }} v${{ env.VERSION }}" --tag ${{ github.ref_name }}

      # vpk uploads under its own file names (the feed refers to them), so the version is added by renaming the installer and portable
      # assets on the release afterwards. Update packages already carry the version and the feed files must keep their names.
      - name: Put the version in installer file names
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq '.assets[] | "\(.id) \(.name)"' | while read -r id name; do
            case "$name" in
              Snaply-*) continue ;;
              *Setup*|*Portable*|*.AppImage|*.pkg)
                new="${name/${APP_ID}-/Snaply-${VERSION}-}"
                [[ "$new" == "$name" ]] && new="Snaply-${VERSION}-$name"
                gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$id" -f name="$new" > /dev/null
                echo "$name -> $new" ;;
            esac
          done

      # The in-app updater reads this feed anonymously, exactly like this step. Retry briefly: GitHub's CDN can lag a few seconds.
      - name: Verify release is visible to the updater
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          url="$REPO_URL/releases/latest/download/releases.win.json"
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sL -o feed.json -w "%{http_code}" "$url" || true)
            if [[ "$code" == "200" ]] && grep -qF "\"Version\":\"$VERSION\"" feed.json; then
              echo "Feed lists $VERSION (attempt $attempt)"
              exit 0
            fi
            echo "Attempt $attempt: HTTP $code, feed does not list $VERSION yet"
            sleep 10
          done
          if [[ "$code" == "404" ]]; then
            echo "::error::$url returned 404 for an anonymous request. If the repository is private, installed apps cannot read releases either: make the repository public or publish releases to a public repository."
          else
            echo "::error::$url (HTTP $code) does not list $VERSION, so installed apps will not detect this update."
          fi
          exit 1

  # macOS and Linux packages. They run after the Windows job so a release only gets them when the tests passed there, and the GitHub release
  # already exists (each OS adds its own files and its own update feed: releases.osx.json / releases.linux.json).
  # These platforms are implemented but not yet verified on real machines; the macOS build is unsigned.
  build-other-platforms:
    needs: build-and-release
    strategy:
      fail-fast: false
      max-parallel: 1          # one upload at a time into the same release
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            rid: osx-arm64
            channel: osx-arm64
            kind: osx
          - name: macOS (Intel)
            os: macos-15-intel
            rid: osx-x64
            channel: osx-x64
            kind: osx
          - name: Linux
            os: ubuntu-latest
            rid: linux-x64
            channel: linux
            kind: linux
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.1-ci.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: >
          dotnet publish ${{ env.PROJECT }} -c Release -r ${{ matrix.rid }} --self-contained true
          -p:Version=${{ env.VERSION }} -o publish

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version ${{ env.VELOPACK_VERSION }}

      # macOS wants an .icns; build it from the PNG sizes the app already ships.
      - name: Make macOS icon
        if: matrix.kind == 'osx'
        run: |
          set=Snaply.iconset
          mkdir "$set"
          a=src/Snaply.App/Assets
          cp $a/snaply-16.png  "$set/icon_16x16.png"
          cp $a/snaply-32.png  "$set/icon_16x16@2x.png"
          cp $a/snaply-32.png  "$set/icon_32x32.png"
          cp $a/snaply-64.png  "$set/icon_32x32@2x.png"
          cp $a/snaply-128.png "$set/icon_128x128.png"
          cp $a/snaply-256.png "$set/icon_128x128@2x.png"
          cp $a/snaply-256.png "$set/icon_256x256.png"
          cp $a/snaply-512.png "$set/icon_256x256@2x.png"
          cp $a/snaply-512.png "$set/icon_512x512.png"
          iconutil -c icns "$set" -o Snaply.icns
          echo "PACK_ICON=Snaply.icns" >> "$GITHUB_ENV"

      - name: Pick Linux icon
        if: matrix.kind == 'linux'
        run: echo "PACK_ICON=src/Snaply.App/Assets/snaply-256.png" >> "$GITHUB_ENV"

      - name: Download previous release
        run: vpk download github --repoUrl "${{ env.REPO_URL }}" --token ${{ secrets.GITHUB_TOKEN }} --channel ${{ matrix.channel }} -o Releases
        continue-on-error: true

      - name: Pack
        run: >
          vpk pack -u ${{ env.APP_ID }} -v ${{ env.VERSION }} -p publish --channel ${{ matrix.channel }}
          -e Snaply --packTitle ${{ env.APP_TITLE }} -i ${{ env.PACK_ICON }} -o Releases

      - name: Upload to GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        run: >
          vpk upload github --repoUrl "${{ env.REPO_URL }}" --token ${{ secrets.GITHUB_TOKEN }} --channel ${{ matrix.channel }}
          -o Releases --merge --publish true --releaseName "${{ env.APP_TITLE }} v${{ env.VERSION }}" --tag ${{ github.ref_name }}

      # vpk uploads under its own file names (the feed refers to them), so the version is added by renaming the installer and portable
      # assets on the release afterwards. Update packages already carry the version and the feed files must keep their names.
      - name: Put the version in installer file names
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq '.assets[] | "\(.id) \(.name)"' | while read -r id name; do
            case "$name" in
              Snaply-*) continue ;;
              *Setup*|*Portable*|*.AppImage|*.pkg)
                new="${name/${APP_ID}-/Snaply-${VERSION}-}"
                [[ "$new" == "$name" ]] && new="Snaply-${VERSION}-$name"
                gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$id" -f name="$new" > /dev/null
                echo "$name -> $new" ;;
            esac
          done

      - name: Verify release is visible to the updater
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          url="$REPO_URL/releases/latest/download/releases.${{ matrix.channel }}.json"
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sL -o feed.json -w "%{http_code}" "$url" || true)
            if [[ "$code" == "200" ]] && grep -qF "\"Version\":\"$VERSION\"" feed.json; then
              echo "Feed lists $VERSION (attempt $attempt)"
              exit 0
            fi
            echo "Attempt $attempt: HTTP $code, feed does not list $VERSION yet"
            sleep 10
          done
          echo "::error::$url (HTTP $code) does not list $VERSION, so installed apps will not detect this update."
          exit 1
